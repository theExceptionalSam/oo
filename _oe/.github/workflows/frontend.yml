name: Frontend CI

on:
  push:
    branches: [main]
    paths: ['school_frontend/**', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['school_frontend/**', '.github/workflows/frontend.yml']

defaults:
  run:
    working-directory: school_frontend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: school_frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (vite build)
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: school_frontend/dist
          retention-days: 7
