version: '3.9'

# =============================================================================
# Local development docker-compose.
#
# In production we use managed services instead:
#   - Postgres   → Supabase Pro (RLS, PITR, Realtime, Storage)
#   - Storage    → Cloudflare R2 (zero egress, S3-compatible)
#   - Search     → Postgres tsvector (no Elasticsearch needed)
#   - Queue      → Graphile Worker on the SAME Postgres (no Redis needed)
#   - Hosting    → Render (API + Worker) + Vercel (frontend)
#
# This compose file is for LOCAL dev only. The only stateful services here
# are Postgres (mandatory) and Redis (optional — only needed for the
# ScopeService cache). MinIO and Elasticsearch are GONE.
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: schoolsync
      POSTGRES_PASSWORD: schoolsync
      POSTGRES_DB: schoolsync
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U schoolsync']
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis is OPTIONAL for local dev — only used for ScopeService caching.
  # The queue is now Graphile Worker on Postgres, not BullMQ on Redis.
  # Comment this out if you don't need scope caching locally.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: schoolsync
      DB_PASSWORD: schoolsync
      DB_DATABASE: schoolsync
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Use local dev JWT keys (generate via ./deploy/gen-dev-keys.sh)
      JWT_PRIVATE_KEY_PATH: /app/keys/private.pem
      JWT_PUBLIC_KEY_PATH: /app/keys/public.pem
      CORS_ORIGINS: http://localhost:5173,http://localhost:3001
    ports:
      - '3000:3000'
    volumes:
      - ./keys:/app/keys:ro

  # Worker process — same image, different start command.
  # In Render: deploy as a separate Background Worker with start = `node dist/workers.js`.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: schoolsync
      DB_PASSWORD: schoolsync
      DB_DATABASE: schoolsync
      WORKER_CONCURRENCY: '3'
      JWT_PRIVATE_KEY_PATH: /app/keys/private.pem
      JWT_PUBLIC_KEY_PATH: /app/keys/public.pem
    command: ['node', 'dist/workers.js']
    volumes:
      - ./keys:/app/keys:ro

volumes:
  pgdata:
  redisdata:
