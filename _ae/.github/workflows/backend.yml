name: Backend CI

on:
  push:
    branches: [main]
    paths: ['schoolsync/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['schoolsync/**', '.github/workflows/backend.yml']

defaults:
  run:
    working-directory: schoolsync

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: schoolsync/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile (nest build)
        run: npm run build

      - name: Unit tests
        run: npm test -- --ci

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: schoolsync/dist
          retention-days: 7
