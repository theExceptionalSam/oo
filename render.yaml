# Render Blueprint — render.com
# Docs: https://render.com/docs/blueprint-spec
#
# Apply: Render dashboard → New → Blueprint → connect this repo → render.yaml
# is auto-detected. Render will create all services listed below.

services:
  # ---- API (NestJS web service) ----
  - type: web
    name: schoolsync-api
    runtime: docker
    plan: standard            # 2 GB RAM — needed for NestJS + TypeORM pool
    region: frankfurt        # closest to Nigeria with good peering
    dockerfilePath: ./_ae/Dockerfile
    dockerContext: ./_ae
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: API_PREFIX
        value: api/v1
      - key: CORS_ORIGINS
        sync: false         # set in dashboard — frontend URL
      - key: DB_HOST
        sync: false         # Supabase pooler host
      - key: DB_PORT
        value: '6543'
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_DATABASE
        value: postgres
      - key: DB_SSL
        value: 'true'
      - key: DB_POOL_MAX
        value: '5'           # small pool — PgBouncer multiplexes
      - key: REDIS_HOST
        sync: false         # Upstash endpoint
      - key: REDIS_PORT
        value: '6379'
      - key: REDIS_PASSWORD
        sync: false
      - key: JWT_PRIVATE_KEY
        sync: false         # paste full PEM (multi-line) as a secret
      - key: JWT_PUBLIC_KEY
        sync: false
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 7d
      - key: S3_ENDPOINT
        sync: false         # R2 endpoint
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: 'false'
      - key: S3_PUBLIC_URL
        sync: false         # R2 public URL
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: APP_URL
        sync: false         # https://app.yourdomain.com
      - key: API_URL
        sync: false         # https://api.yourdomain.com

  # ---- Background Worker (Graphile Worker) ----
  # Same image, different start command. Scales independently of the API.
  - type: worker
    name: schoolsync-worker
    runtime: docker
    plan: standard
    region: frankfurt
    dockerfilePath: ./_ae/Dockerfile
    dockerContext: ./_ae
    dockerCommand: node dist/workers.js
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: '6543'
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_DATABASE
        value: postgres
      - key: DB_SSL
        value: 'true'
      - key: WORKER_CONCURRENCY
        value: '5'
      - key: SENTRY_DSN
        sync: false
      # Worker doesn't need JWT keys — it doesn't sign tokens.
      # But it needs the same DB creds as the API.

  # ---- Optional: scheduled DB backup verification ----
  # Runs every 6 hours: restores latest backup to a throwaway DB,
  # verifies row counts, tears down. Catches silent backup corruption.
  # Uncomment when you have a paid Render plan.
  # - type: cron
  #   name: schoolsync-backup-verify
  #   runtime: docker
  #   plan: starter
  #   schedule: "0 */6 * * *"
  #   dockerfilePath: ./_ae/Dockerfile
  #   dockerContext: ./_ae
  #   dockerCommand: node dist/scripts/verify-backup.js
